<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#2A5298"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Gold accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#C9A84C"/>
  <!-- Logo icon -->
  <text x="100" y="280" font-size="120" font-family="serif">💰</text>
  <!-- Blog name -->
  <text x="100" y="360" font-size="72" font-weight="bold" font-family="Georgia,serif" fill="#FFFFFF">Smart Wealth</text>
  <text x="100" y="440" font-size="72" font-weight="bold" font-family="Georgia,serif" fill="#C9A84C">Blog</text>
  <!-- Tagline -->
  <text x="100" y="510" font-size="28" font-family="Arial,sans-serif" fill="rgba(255,255,255,0.75)">Investments · Taxation · Real Estate · France</text>
  <!-- Right decoration -->
  <circle cx="1050" cy="315" r="180" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1050" cy="315" r="120" fill="rgba(255,255,255,0.04)"/>
</svg>
